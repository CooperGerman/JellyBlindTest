<div id="JellyBlindTestPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <style>
    #JellyBlindTestPage {
      color-scheme: dark;
      --blind-bg: #10171b;
      --blind-panel: #1b252a;
      --blind-line: #35464b;
      --blind-text: #f4f5f3;
      --blind-muted: #a9b8b8;
      --blind-accent: #55d6be;
      --blind-warm: #ffd166;
      --blind-error: #ff8178;
    }

    #JellyBlindTestPage * { box-sizing: border-box; }

    #JellyBlindTestPage {
      margin: 0;
      min-height: 100%;
      color: var(--blind-text);
      background:
        radial-gradient(ellipse at 80% 0%, rgba(62, 112, 107, .23), transparent 45%),
        linear-gradient(145deg, #10171b 0%, #152126 55%, #25201b 100%);
      font-family: system-ui, sans-serif;
    }

    #JellyBlindTestPage .blind-shell {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    #JellyBlindTestPage .blind-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--blind-line);
    }

    #JellyBlindTestPage h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    #JellyBlindTestPage .blind-kicker {
      margin: 0 0 6px;
      color: var(--blind-accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    #JellyBlindTestPage .blind-score {
      min-width: 100px;
      padding: 10px 14px;
      border: 1px solid var(--blind-line);
      border-radius: 6px;
      color: var(--blind-warm);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #JellyBlindTestPage .blind-heading-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #JellyBlindTestPage .blind-settings-link {
      color: var(--blind-muted);
      font-size: 13px;
      text-decoration: none;
    }

    #JellyBlindTestPage .blind-settings-link:hover,
    #JellyBlindTestPage .blind-settings-link:focus { color: var(--blind-accent); }

    #JellyBlindTestPage .blind-settings-link[hidden] { display: none; }

    #JellyBlindTestPage .blind-board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      gap: 24px;
      margin-top: 28px;
      align-items: start;
    }

    #JellyBlindTestPage .blind-main { min-width: 0; }

    #JellyBlindTestPage .blind-stage {
      position: relative;
      display: grid;
      min-height: 250px;
      place-items: center;
      overflow: hidden;
      padding: 32px;
      border: 1px solid var(--blind-line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(85, 214, 190, .08), transparent 45%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 1px, transparent 1px 14px),
        var(--blind-panel);
      text-align: center;
    }

    #JellyBlindTestPage .blind-stage-artwork {
      position: absolute;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      opacity: .23;
      pointer-events: none;
    }

    #JellyBlindTestPage .blind-stage-artwork[hidden] { display: none; }

    #JellyBlindTestPage .blind-stage-artwork::after {
      position: absolute;
      inset: 0;
      background: rgba(16, 23, 27, .52);
      content: '';
    }

    #JellyBlindTestPage .blind-stage-artwork img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(1px);
      transform: scale(1.025);
    }

    #JellyBlindTestPage .blind-stage-content {
      position: relative;
      z-index: 1;
      width: min(100%, 460px);
    }

    #JellyBlindTestPage .blind-stage-mark {
      display: grid;
      width: 72px;
      aspect-ratio: 1;
      margin: 0 auto 18px;
      place-items: center;
      border: 1px solid rgba(85, 214, 190, .45);
      border-radius: 50%;
      color: var(--blind-accent);
      font-size: 30px;
    }

    #JellyBlindTestPage .blind-stage h2 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    #JellyBlindTestPage .blind-stage p {
      margin: 0;
      color: var(--blind-muted);
      line-height: 1.5;
    }

    #JellyBlindTestPage .blind-countdown {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 18px;
      padding: 7px 12px;
      border: 1px solid rgba(85, 214, 190, .36);
      border-radius: 5px;
      color: var(--blind-accent);
      background: rgba(16, 23, 27, .76);
      font-variant-numeric: tabular-nums;
    }

    #JellyBlindTestPage .blind-countdown[hidden] { display: none; }

    #JellyBlindTestPage .blind-countdown strong {
      min-width: 2ch;
      font-size: 22px;
      text-align: center;
    }

    #JellyBlindTestPage .blind-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    #JellyBlindTestPage .blind-source-label { color: var(--blind-muted); font-size: 14px; }
    #JellyBlindTestPage .blind-source-select {
      min-width: min(280px, 100%);
      min-height: 44px;
      padding: 9px 34px 9px 12px;
      border: 1px solid var(--blind-line);
      border-radius: 5px;
      color: var(--blind-text);
      background: #121a1e;
      font: inherit;
    }
    #JellyBlindTestPage .blind-source-warning {
      flex: 1 1 100%;
      margin: 0;
      color: var(--blind-warm);
      font-size: 13px;
    }
    #JellyBlindTestPage .blind-source-warning[hidden] { display: none; }

    #JellyBlindTestPage .blind-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid var(--blind-line);
      border-radius: 5px;
      color: var(--blind-text);
      background: #243238;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #JellyBlindTestPage .blind-button.primary {
      border-color: var(--blind-accent);
      color: #0d1b1a;
      background: var(--blind-accent);
    }

    #JellyBlindTestPage .blind-button:disabled { cursor: default; opacity: .55; }
    #JellyBlindTestPage .blind-button[hidden] { display: none; }

    #JellyBlindTestPage .blind-answer { margin-top: 25px; }

    #JellyBlindTestPage .blind-answer label {
      display: block;
      margin-bottom: 8px;
      color: var(--blind-muted);
      font-size: 14px;
    }

    #JellyBlindTestPage .blind-answer-row {
      display: flex;
      gap: 9px;
    }

    #JellyBlindTestPage .blind-answer input {
      width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid var(--blind-line);
      border-radius: 5px;
      outline: none;
      color: var(--blind-text);
      background: #121a1e;
      font: inherit;
    }

    #JellyBlindTestPage .blind-answer input:focus { border-color: var(--blind-accent); }
    #JellyBlindTestPage .blind-answer input:disabled { opacity: .7; }

    #JellyBlindTestPage .blind-result {
      min-height: 28px;
      margin-top: 12px;
      color: var(--blind-muted);
      line-height: 1.5;
    }

    #JellyBlindTestPage .blind-result.correct { color: var(--blind-accent); }
    #JellyBlindTestPage .blind-result.incorrect { color: var(--blind-warm); }
    #JellyBlindTestPage .blind-result.error { color: var(--blind-error); }

    #JellyBlindTestPage .blind-rail {
      padding: 18px;
      border-top: 3px solid var(--blind-warm);
      background: rgba(16, 23, 27, .7);
    }

    #JellyBlindTestPage .blind-rail h2 {
      margin: 0 0 16px;
      color: var(--blind-warm);
      font-size: 15px;
      text-transform: uppercase;
    }

    #JellyBlindTestPage .blind-rounds {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #JellyBlindTestPage .blind-rounds li {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(169, 184, 184, .17);
      color: var(--blind-muted);
      font-size: 13px;
    }

    #JellyBlindTestPage .blind-rounds li.current { color: var(--blind-text); }
    #JellyBlindTestPage .blind-rounds li.done { color: var(--blind-accent); }

    #JellyBlindTestPage .blind-footnote {
      margin: 14px 0 0;
      color: var(--blind-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    #JellyBlindTestPage .blind-results { margin-top: 34px; }
    #JellyBlindTestPage .blind-results[hidden] { display: none; }
    #JellyBlindTestPage .blind-results h2 { margin: 0 0 12px; font-size: 20px; }
    #JellyBlindTestPage .blind-results-wrap { overflow-x: auto; border-top: 1px solid var(--blind-line); }
    #JellyBlindTestPage .blind-results table { width: 100%; border-collapse: collapse; text-align: left; }
    #JellyBlindTestPage .blind-results th,
    #JellyBlindTestPage .blind-results td { min-width: 150px; padding: 12px 14px; border-bottom: 1px solid var(--blind-line); vertical-align: top; }
    #JellyBlindTestPage .blind-results th { color: var(--blind-muted); font-size: 12px; font-weight: 650; }
    #JellyBlindTestPage .blind-results td:first-child,
    #JellyBlindTestPage .blind-results th:first-child { width: 70px; min-width: 70px; }
    #JellyBlindTestPage .blind-results .expected-title { display: block; font-weight: 650; }
    #JellyBlindTestPage .blind-results .expected-artist { display: block; margin-top: 4px; color: var(--blind-muted); font-size: 13px; }
    #JellyBlindTestPage .blind-results .submitted-answer { white-space: pre-wrap; }

    @media (max-width: 640px) {
      #JellyBlindTestPage .blind-shell { padding-top: 24px; }
      #JellyBlindTestPage .blind-heading { align-items: start; }
      #JellyBlindTestPage .blind-board { grid-template-columns: 1fr; }
      #JellyBlindTestPage .blind-rail { order: -1; }
      #JellyBlindTestPage .blind-rounds { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      #JellyBlindTestPage .blind-rounds li { display: block; border-bottom: 0; text-align: center; }
      #JellyBlindTestPage .blind-rounds li span { display: block; }
      #JellyBlindTestPage .blind-stage { min-height: 220px; padding: 24px 16px; }
      #JellyBlindTestPage .blind-answer-row { flex-direction: column; }
      #JellyBlindTestPage .blind-source-select { flex: 1 1 100%; }
    }
  </style>
  <div data-role="content">
  <main class="blind-shell">
    <header class="blind-heading">
      <div>
        <p class="blind-kicker">Jellyfin music game</p>
        <h1>Blind Test</h1>
      </div>
      <div class="blind-heading-actions">
        <a class="blind-settings-link" id="settings-link" href="#/configurationpage?name=JellyBlindTestSettings" hidden>Settings</a>
        <div class="blind-score" aria-live="polite">Score <span id="score">0</span>/<span id="score-total">10</span></div>
      </div>
    </header>

    <div class="blind-board">
      <section class="blind-main" aria-label="Blind test game">
        <div class="blind-stage" aria-live="polite">
          <div class="blind-stage-artwork" id="artwork-container" hidden>
            <img id="album-art" alt="Album artwork">
          </div>
          <div class="blind-stage-content">
            <div class="blind-stage-mark" aria-hidden="true">♪</div>
            <h2 id="stage-title">Ready when you are</h2>
            <p id="stage-copy">Five random songs. Enter the title and/or artist while each song plays.</p>
            <div class="blind-countdown" id="countdown" aria-live="off" hidden>
              <span id="countdown-label">Music</span>
              <strong id="countdown-value">5</strong>
              <span>sec</span>
            </div>
          </div>
        </div>

        <div class="blind-actions">
          <label class="blind-source-label" for="source-select">Play from</label>
          <select class="blind-source-select" id="source-select" aria-label="Choose a music source">
            <option value="library">Whole library</option>
            <option value="popular">Most popular (top 500)</option>
          </select>
          <button class="blind-button primary" id="start-button" type="button">Start test</button>
          <p class="blind-source-warning" id="source-warning" role="status" hidden></p>
        </div>

        <form class="blind-answer" id="answer-form" hidden>
          <label for="answer-input">Song title and/or artist</label>
          <div class="blind-answer-row">
            <input id="answer-input" name="answer" type="text" autocomplete="off" placeholder="Type the song title or artist" disabled>
            <button class="blind-button" id="submit-button" type="submit" disabled>Check answer</button>
          </div>
        </form>
        <p class="blind-result" id="result" role="status" aria-live="polite"></p>
        <audio id="audio" preload="none"></audio>
        <audio id="audio-next" preload="none"></audio>
      </section>

      <aside class="blind-rail" aria-label="Game progress">
        <h2 id="round-heading">Your set</h2>
        <ol class="blind-rounds" id="round-list">
        </ol>
        <p class="blind-footnote">Only songs available to your Jellyfin user are included.</p>
      </aside>
    </div>

    <section class="blind-results" id="results-summary" aria-labelledby="results-heading" hidden>
      <h2 id="results-heading">Round answers</h2>
      <div class="blind-results-wrap">
        <table aria-label="Expected and submitted answers by round">
          <thead>
            <tr><th scope="col">Round</th><th scope="col">Expected answer</th><th scope="col">Your submitted answer</th></tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  </div>

  <script>
    (function () {
      'use strict';

      const PLUGIN_ID = 'dcfb6e4c-e418-4bca-9a4a-f960e991ad00';
      const DEFAULT_ROUNDS = 5;
      const DEFAULT_GUESSING_SECONDS = 20;
      const DEFAULT_POPULAR_TRACK_POOL_SIZE = 500;
      const DEFAULT_REVEAL_SECONDS = 5;
      const ANSWER_SIMILARITY_THRESHOLD = 0.8;
      const CROSSFADE_MILLISECONDS = 1500;
      const MAX_PICK_ATTEMPTS = 12;
      const MAX_POPULAR_ARTIST_PICK_ATTEMPTS = 40;
      const STUB_TAG = 'mdiscover-stub';
      const api = window.ApiClient ?? (window.parent !== window ? window.parent.ApiClient : null);
      const audioPlayers = [document.getElementById('audio'), document.getElementById('audio-next')];
      const startButton = document.getElementById('start-button');
      const answerForm = document.getElementById('answer-form');
      const answerInput = document.getElementById('answer-input');
      const submitButton = document.getElementById('submit-button');
      const stageTitle = document.getElementById('stage-title');
      const stageCopy = document.getElementById('stage-copy');
      const result = document.getElementById('result');
      const scoreLabel = document.getElementById('score');
      const roundHeading = document.getElementById('round-heading');
      const roundList = document.getElementById('round-list');
      const scoreTotalLabel = document.getElementById('score-total');
      const sourceSelect = document.getElementById('source-select');
      const sourceWarning = document.getElementById('source-warning');
      const countdown = document.getElementById('countdown');
      const countdownLabel = document.getElementById('countdown-label');
      const countdownValue = document.getElementById('countdown-value');
      const settingsLink = document.getElementById('settings-link');
      const artworkContainer = document.getElementById('artwork-container');
      const albumArt = document.getElementById('album-art');

      if (settingsLink && window.parent !== window) {
        settingsLink.href = window.parent.location.pathname + '#/configurationpage?name=JellyBlindTestSettings';
        settingsLink.target = '_top';
      }

      let totalRounds = DEFAULT_ROUNDS;
      let guessingSeconds = DEFAULT_GUESSING_SECONDS;
      let popularTrackPoolSize = DEFAULT_POPULAR_TRACK_POOL_SIZE;
      let revealSeconds = DEFAULT_REVEAL_SECONDS;
      let currentTrack = null;
      let round = 0;
      let score = 0;
      let submitted = false;
      let roundRevealed = false;
      let requestInProgress = false;
      let countdownInterval = 0;
      let crossfadeInterval = 0;
      let activeAudio = audioPlayers[0];
      let totalCount = null;
      let popularTracks = null;
      const usedIds = new Set();
      const usedPopularArtists = new Set();
      const roundResults = [];
      const resultsSummary = document.getElementById('results-summary');
      const resultsBody = document.getElementById('results-body');

      function setResult(message, tone) {
        result.textContent = message;
        result.className = 'blind-result' + (tone ? ' ' + tone : '');
      }

      function normalizeAnswer(value) {
        return String(value ?? '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLocaleLowerCase()
          .replace(/[^\p{L}\p{N}]+/gu, ' ')
          .trim();
      }

      function similarity(left, right) {
        if (!left || !right) return 0;
        const leftCharacters = Array.from(left);
        const rightCharacters = Array.from(right);
        let previousRow = Array.from({ length: rightCharacters.length + 1 }, (_, index) => index);

        for (let leftIndex = 1; leftIndex <= leftCharacters.length; leftIndex++) {
          const currentRow = [leftIndex];
          for (let rightIndex = 1; rightIndex <= rightCharacters.length; rightIndex++) {
            const substitutionCost = leftCharacters[leftIndex - 1] === rightCharacters[rightIndex - 1] ? 0 : 1;
            currentRow[rightIndex] = Math.min(
              currentRow[rightIndex - 1] + 1,
              previousRow[rightIndex] + 1,
              previousRow[rightIndex - 1] + substitutionCost,
            );
          }
          previousRow = currentRow;
        }

        return 1 - previousRow[rightCharacters.length] / Math.max(leftCharacters.length, rightCharacters.length);
      }

      function phraseSimilarity(answer, target) {
        const answerWords = normalizeAnswer(answer).split(' ').filter(Boolean);
        const targetPhrase = normalizeAnswer(target);
        const targetWordCount = targetPhrase.split(' ').filter(Boolean).length;
        if (!answerWords.length || !targetWordCount) return 0;

        let bestMatch = 0;
        const shortestWindow = Math.max(1, targetWordCount - 1);
        const longestWindow = targetWordCount + 1;
        for (let start = 0; start < answerWords.length; start++) {
          for (let length = shortestWindow; length <= longestWindow && start + length <= answerWords.length; length++) {
            bestMatch = Math.max(
              bestMatch,
              similarity(answerWords.slice(start, start + length).join(' '), targetPhrase),
            );
          }
        }
        return bestMatch;
      }

      function getArtistLabels(track) {
        const artists = track.Artists?.length
          ? track.Artists
          : track.AlbumArtists?.length
            ? track.AlbumArtists.map(artist => typeof artist === 'string' ? artist : artist.Name)
            : [track.AlbumArtist];
        return [...new Set(artists
          .map(artist => typeof artist === 'string' ? artist : artist?.Name)
          .map(artist => String(artist ?? '').trim())
          .filter(Boolean))];
      }

      function getArtistNames(track) {
        return getArtistLabels(track).map(normalizeAnswer);
      }

      function updateRoundList() {
        [...roundList.children].forEach((item, index) => {
          item.classList.toggle('current', index === round - 1 && !roundRevealed);
          item.classList.toggle('done', index < round - 1 || (index === round - 1 && roundRevealed));
          const state = item.children[1];
          if (index < round - 1 || (index === round - 1 && roundRevealed)) {
            state.textContent = 'Done';
          } else if (index === round - 1) {
            state.textContent = 'Playing';
          } else {
            state.textContent = 'Waiting';
          }
        });
        roundHeading.textContent = round > 0 && round <= totalRounds
          ? 'Round ' + round + ' of ' + totalRounds
          : 'Your set';
      }

      function renderRoundSlots() {
        roundList.replaceChildren();
        for (let index = 0; index < totalRounds; index++) {
          const item = document.createElement('li');
          const number = document.createElement('span');
          const state = document.createElement('span');
          number.textContent = String(index + 1).padStart(2, '0');
          state.textContent = 'Waiting';
          item.append(number, state);
          roundList.append(item);
        }
        scoreTotalLabel.textContent = String(totalRounds * 2);
      }

      async function loadSettings() {
        try {
          const settings = await api.ajax({
            type: 'GET',
            url: api.getUrl('jellyblindtest/settings'),
            dataType: 'json',
          });
          const configuredRounds = Number(settings?.roundCount ?? settings?.RoundCount);
          const configuredGuessing = Number(settings?.guessingSeconds ?? settings?.GuessingSeconds);
          const configuredPopularPoolSize = Number(settings?.popularTrackPoolSize ?? settings?.PopularTrackPoolSize);
          const legacyPreview = Number(settings?.previewSeconds ?? settings?.PreviewSeconds);
          const legacyAnswer = Number(settings?.answerSeconds ?? settings?.AnswerSeconds);
          const configuredReveal = Number(settings?.revealSeconds ?? settings?.RevealSeconds);
          if (Number.isFinite(configuredRounds)) totalRounds = Math.max(1, Math.min(20, Math.round(configuredRounds)));
          if (Number.isFinite(configuredGuessing) && configuredGuessing > 0) {
            guessingSeconds = Math.max(1, Math.min(150, Math.round(configuredGuessing)));
          } else if (Number.isFinite(legacyPreview) && Number.isFinite(legacyAnswer)) {
            guessingSeconds = Math.max(1, Math.min(150, Math.round(legacyPreview + legacyAnswer)));
          }
          if (Number.isFinite(configuredPopularPoolSize) && configuredPopularPoolSize > 0) {
            popularTrackPoolSize = Math.max(1, Math.min(5000, Math.round(configuredPopularPoolSize)));
          }
          if (Number.isFinite(configuredReveal)) revealSeconds = Math.max(1, Math.min(30, Math.round(configuredReveal)));
        } catch (_) {
          setResult('Using default game settings.', 'error');
        }

        sourceSelect.querySelector('option[value="popular"]').textContent = 'Most popular artists';
        renderRoundSlots();
        stageCopy.textContent = totalRounds + ' random songs. ' + guessingSeconds + ' seconds to guess while each song plays.';
        updateSourceWarning();
      }

      function updateSourceWarning() {
        const selectedOption = sourceSelect.selectedOptions[0];
        if (sourceSelect.value === 'popular') {
          sourceWarning.hidden = false;
          sourceWarning.textContent = 'Random artists, songs weighted by Deezer rank within the global top ' + popularTrackPoolSize + '. Run Music Discovery\'s popularity scan if needed.';
          return;
        }

        const songCountValue = selectedOption?.dataset.songCount;
        const songCount = songCountValue ? Number(songCountValue) : Number.NaN;
        if (sourceSelect.value === 'library' || !Number.isFinite(songCount) || songCount >= totalRounds) {
          sourceWarning.hidden = true;
          sourceWarning.textContent = '';
          return;
        }

        sourceWarning.hidden = false;
        sourceWarning.textContent = songCount < 1
          ? 'This playlist has no songs available.'
          : 'This playlist has ' + songCount + ' song' + (songCount === 1 ? '' : 's') + ' for ' + totalRounds + ' rounds; songs may repeat.';
      }

      async function loadPlaylists() {
        try {
          const response = await api.getItems(api.getCurrentUserId(), {
            IncludeItemTypes: 'Playlist',
            Recursive: true,
            Limit: 500,
            Fields: 'MediaType,ChildCount',
            SortBy: 'SortName',
            SortOrder: 'Ascending',
          });
          const playlists = (response.Items ?? [])
            .filter(playlist => playlist.MediaType === 'Audio')
            .sort((left, right) => left.Name.localeCompare(right.Name));
          playlists.forEach(playlist => {
            const option = document.createElement('option');
            option.value = playlist.Id;
            option.textContent = playlist.Name;
            option.dataset.songCount = String(playlist.ChildCount ?? playlist.RecursiveItemCount ?? '');
            sourceSelect.append(option);
          });
          updateSourceWarning();
        } catch (_) {
          setResult('Could not load playlists. Whole library is still available.', 'error');
        }
      }

      function showAlbumArtwork(track) {
        const imageTag = track.AlbumPrimaryImageTag || track.ImageTags?.Primary;
        const imageItemId = track.AlbumId || track.Id;
        if (!imageTag || !imageItemId) {
          artworkContainer.hidden = true;
          albumArt.removeAttribute('src');
          return;
        }

        albumArt.alt = track.Album ? track.Album + ' album artwork' : 'Album artwork';
        albumArt.onerror = () => { artworkContainer.hidden = true; };
        albumArt.src = api.getImageUrl(imageItemId, {
          type: 'Primary',
          tag: imageTag,
          maxWidth: 440,
          quality: 90,
        });
        artworkContainer.hidden = false;
      }

      function clearCountdown() {
        window.clearInterval(countdownInterval);
        countdownInterval = 0;
        countdown.hidden = true;
      }

      function startCountdown(label, seconds, onComplete) {
        window.clearInterval(countdownInterval);
        countdownLabel.textContent = label;
        countdown.hidden = false;
        const deadline = Date.now() + seconds * 1000;

        function tick() {
          const remaining = Math.max(0, deadline - Date.now());
          countdownValue.textContent = String(Math.ceil(remaining / 1000));
          if (remaining === 0) {
            window.clearInterval(countdownInterval);
            countdownInterval = 0;
            onComplete();
          }
        }

        tick();
        if (seconds > 0) countdownInterval = window.setInterval(tick, 100);
      }

      function stopAudio(reset = true) {
        clearCountdown();
        window.clearInterval(crossfadeInterval);
        crossfadeInterval = 0;
        audioPlayers.forEach(player => {
          player.pause();
          player.volume = 1;
          player.loop = false;
          if (reset) {
            try { player.currentTime = 0; } catch (_) { /* Metadata may not be ready. */ }
          }
        });
        activeAudio = audioPlayers[0];
      }

      function crossfadeTo(incomingAudio) {
        const outgoingAudio = activeAudio;
        if (outgoingAudio === incomingAudio || outgoingAudio.paused || outgoingAudio.ended) {
          outgoingAudio.pause();
          incomingAudio.volume = 1;
          activeAudio = incomingAudio;
          return;
        }

        window.clearInterval(crossfadeInterval);
        const startedAt = performance.now();
        activeAudio = incomingAudio;
        crossfadeInterval = window.setInterval(() => {
          const progress = Math.min((performance.now() - startedAt) / CROSSFADE_MILLISECONDS, 1);
          incomingAudio.volume = progress;
          outgoingAudio.volume = 1 - progress;
          if (progress >= 1) {
            window.clearInterval(crossfadeInterval);
            crossfadeInterval = 0;
            outgoingAudio.pause();
            try { outgoingAudio.currentTime = 0; } catch (_) { /* Metadata may not be ready. */ }
            outgoingAudio.volume = 1;
            incomingAudio.volume = 1;
          }
        }, 40);
      }

      function finishGame() {
        renderResults();
        stopAudio();
        currentTrack = null;
        stageTitle.textContent = 'Set complete';
        stageCopy.textContent = 'You scored ' + score + ' out of ' + totalRounds * 2 + ' points. Ready for another set?';
        answerForm.hidden = true;
        artworkContainer.hidden = true;
        albumArt.removeAttribute('src');
        countdown.hidden = true;
        startButton.hidden = false;
        startButton.textContent = 'Play again';
        roundHeading.textContent = 'Final score';
        setResult('');
        sourceSelect.disabled = false;
      }

      function renderResults() {
        resultsBody.replaceChildren();
        roundResults.forEach((roundResult, index) => {
          const row = document.createElement('tr');
          const roundCell = document.createElement('td');
          const expectedCell = document.createElement('td');
          const answerCell = document.createElement('td');
          const title = document.createElement('span');
          const artist = document.createElement('span');

          roundCell.textContent = String(index + 1).padStart(2, '0');
          title.className = 'expected-title';
          title.textContent = roundResult.title;
          artist.className = 'expected-artist';
          artist.textContent = roundResult.artist || 'Unknown artist';
          answerCell.className = 'submitted-answer';
          answerCell.textContent = roundResult.submittedAnswer || 'No answer submitted';
          expectedCell.append(title, artist);
          row.append(roundCell, expectedCell, answerCell);
          resultsBody.append(row);
        });
        resultsSummary.hidden = false;
      }

      async function choosePopularTrack(userId) {
        if (popularTracks === null) {
          const response = await api.ajax({
            type: 'GET',
            url: api.getUrl('mdiscover/popularity/top', { limit: popularTrackPoolSize }),
            dataType: 'json',
          });
          const tracks = response?.tracks ?? response?.Tracks ?? [];
          popularTracks = [...new Map(tracks
            .filter(track => Number(track.deezerRank ?? track.DeezerRank) > 0)
            .map(track => [track.itemId ?? track.ItemId, track])
            .filter(([itemId]) => Boolean(itemId))).values()];
          if (popularTracks.length < popularTrackPoolSize) {
            sourceWarning.hidden = false;
            sourceWarning.textContent = 'Only ' + popularTracks.length + ' of ' + popularTrackPoolSize + ' ranked songs are cached. Run Music Discovery\'s popularity scan to expand the pool.';
          }
        }

        totalCount = popularTracks.length;
        if (totalCount < 1) {
          throw new Error('No globally ranked songs are cached. Run Music Discovery\'s Deezer popularity scan first.');
        }
        if (usedIds.size >= totalCount) {
          usedIds.clear();
          usedPopularArtists.clear();
        }

        for (let attempt = 0; attempt < MAX_POPULAR_ARTIST_PICK_ATTEMPTS; attempt++) {
          const groups = new Map();
          popularTracks.forEach(track => {
            const artist = (track.artists ?? track.Artists ?? [])[0];
            const key = normalizeAnswer(artist);
            if (!key || usedPopularArtists.has(key)) return;
            if (!groups.has(key)) groups.set(key, { key, tracks: [] });
            groups.get(key).tracks.push(track);
          });

          if (groups.size === 0 && usedPopularArtists.size > 0) {
            usedPopularArtists.clear();
            continue;
          }
          if (groups.size === 0) break;

          const artists = [...groups.values()];
          const artistGroup = artists[Math.floor(Math.random() * artists.length)];
          usedPopularArtists.add(artistGroup.key);
          const candidates = artistGroup.tracks.filter(track => !usedIds.has(track.itemId ?? track.ItemId));
          if (candidates.length === 0) continue;

          const totalWeight = candidates.reduce((sum, track) => sum + Math.max(1, Number(track.deezerRank ?? track.DeezerRank) || 1), 0);
          let ticket = Math.random() * totalWeight;
          const selected = candidates.find(track => {
            ticket -= Math.max(1, Number(track.deezerRank ?? track.DeezerRank) || 1);
            return ticket <= 0;
          }) ?? candidates[0];
          const itemId = selected.itemId ?? selected.ItemId;

          try {
            const item = await api.getItem(userId, itemId);
            if (!item?.Id) continue;
            usedIds.add(item.Id);
            return item;
          } catch (_) {
            continue;
          }
        }

        throw new Error('No cached popular tracks are available for a random artist. Run Music Discovery\'s popularity scan or choose another source.');
      }

      async function chooseRandomTrack() {
        const userId = api.getCurrentUserId();
        const selectedSource = sourceSelect.value;
        if (selectedSource === 'popular') return choosePopularTrack(userId);
        const baseQuery = {
          IncludeItemTypes: 'Audio',
          Recursive: true,
          Limit: 1,
          Fields: 'Tags,ImageTags,AlbumPrimaryImageTag,AlbumId,Album,AlbumArtist,Artists,AlbumArtists',
        };

        async function getAudioItems(startIndex, enableTotalRecordCount) {
          const query = {
            ...baseQuery,
            EnableTotalRecordCount: enableTotalRecordCount,
            ...(startIndex === null ? {} : { StartIndex: startIndex }),
          };
          if (selectedSource === 'library') return api.getItems(userId, query);

          return api.ajax({
            type: 'GET',
            url: api.getUrl('Playlists/' + encodeURIComponent(selectedSource) + '/Items', {
              userId,
              StartIndex: startIndex ?? 0,
              Limit: 1,
              EnableTotalRecordCount: enableTotalRecordCount,
              Fields: baseQuery.Fields,
            }),
            dataType: 'json',
          });
        }

        if (totalCount === null) {
          const countResponse = await getAudioItems(null, true);
          totalCount = Number(countResponse?.TotalRecordCount ?? 0);
        }

        if (totalCount < 1) {
          throw new Error(selectedSource === 'library'
            ? 'No songs are available in your Jellyfin library.'
            : 'The selected playlist has no available songs.');
        }
        if (usedIds.size >= totalCount) usedIds.clear();

        for (let attempt = 0; attempt < MAX_PICK_ATTEMPTS; attempt++) {
          const startIndex = Math.floor(Math.random() * totalCount);
          const response = await getAudioItems(startIndex, false);
          const item = response?.Items?.[0];
          if (!item?.Id || usedIds.has(item.Id)) continue;
          if ((item.Tags ?? []).includes(STUB_TAG)) continue;
          usedIds.add(item.Id);
          return item;
        }

        throw new Error('Could not find another unused song. Try starting a new set.');
      }

      async function loadRound() {
        if (requestInProgress) return;
        requestInProgress = true;
        clearCountdown();
        submitted = false;
        roundRevealed = false;
        sourceSelect.disabled = true;
        currentTrack = null;
        startButton.hidden = true;
        answerForm.hidden = true;
        artworkContainer.hidden = true;
        albumArt.removeAttribute('src');
        setResult('Finding a random song…');
        stageTitle.textContent = 'Picking a song';
        stageCopy.textContent = 'One moment.';

        try {
          currentTrack = await chooseRandomTrack();
          round++;
          roundResults[round - 1] = {
            title: currentTrack.Name,
            artist: getArtistLabels(currentTrack).join(', '),
            submittedAnswer: '',
            songMatched: false,
            artistMatched: false,
          };
          answerForm.hidden = false;
          answerInput.disabled = false;
          submitButton.disabled = false;
          answerInput.value = '';
          stageTitle.textContent = 'Guess the song or artist';
          stageCopy.textContent = 'The song is playing. Enter the title and/or artist before the timer ends.';
          setResult('');
          updateRoundList();

          const streamUrl = api.getUrl('Audio/' + encodeURIComponent(currentTrack.Id) + '/stream', {
            api_key: api.accessToken(),
            static: true,
          });
          const incomingAudio = activeAudio === audioPlayers[0] ? audioPlayers[1] : audioPlayers[0];
          incomingAudio.pause();
          incomingAudio.removeAttribute('src');
          incomingAudio.load();
          incomingAudio.src = streamUrl;
          incomingAudio.loop = true;
          incomingAudio.volume = activeAudio.paused || activeAudio.ended ? 1 : 0;
          await incomingAudio.play();
          crossfadeTo(incomingAudio);
          answerInput.focus();
          startCountdown('Guessing', guessingSeconds, () => beginRevealPhase(!submitted));
        } catch (error) {
          stopAudio();
          answerForm.hidden = true;
          answerInput.disabled = true;
          submitButton.disabled = true;
          sourceSelect.disabled = false;
          stageTitle.textContent = 'Could not start this round';
          stageCopy.textContent = error?.message ?? 'The song library could not be read.';
          startButton.hidden = false;
          startButton.textContent = round === 0 ? 'Try again' : 'Start a new set';
          setResult('Check that this user has access to music in Jellyfin.', 'error');
        } finally {
          requestInProgress = false;
        }
      }

      function revealAnswer(timedOut) {
        if (!currentTrack) return;
        submitted = true;
        roundRevealed = true;
        answerForm.hidden = true;
        answerInput.disabled = true;
        submitButton.disabled = true;

        const artist = getArtistLabels(currentTrack).join(', ') || 'Unknown artist';
        if (timedOut) {
          stageTitle.textContent = 'Time is up';
          setResult('No answer submitted. The song was:', 'incorrect');
        }
        stageCopy.textContent = currentTrack.Name + ' — ' + artist;
        showAlbumArtwork(currentTrack);
        updateRoundList();
      }

      async function beginRevealPhase(timedOut) {
        revealAnswer(timedOut);

        countdownLabel.textContent = 'Next song in';
        try {
          if (activeAudio.paused) await activeAudio.play();
        } catch (_) {
          setResult('The reveal will continue without audio.', 'error');
        }
        startCountdown('Next song in', revealSeconds, () => {
          if (round >= totalRounds) finishGame();
          else loadRound();
        });
      }

      function submitAnswer(event) {
        event.preventDefault();
        if (!currentTrack || roundRevealed) return;
        const guess = normalizeAnswer(answerInput.value);
        if (!guess) {
          setResult('Enter a song title and/or artist.', 'error');
          answerInput.focus();
          return;
        }

        submitted = true;
        const roundResult = roundResults[round - 1];
        roundResult.submittedAnswer = answerInput.value.trim();
        const songMatched = phraseSimilarity(guess, currentTrack.Name) > ANSWER_SIMILARITY_THRESHOLD;
        const artists = getArtistNames(currentTrack);
        const matchedArtists = artists.filter(artist => phraseSimilarity(guess, artist) > ANSWER_SIMILARITY_THRESHOLD).length;
        const artistMatched = artists.length > 0 && matchedArtists > artists.length / 2;
        const newSongPoint = songMatched && !roundResult.songMatched;
        const newArtistPoint = artistMatched && !roundResult.artistMatched;
        roundResult.songMatched ||= songMatched;
        roundResult.artistMatched ||= artistMatched;
        const points = Number(newSongPoint) + Number(newArtistPoint);
        score += points;
        scoreLabel.textContent = String(score);

        const matchedCategories = [roundResult.songMatched ? 'song' : '', roundResult.artistMatched ? 'artist' : ''].filter(Boolean);
        stageTitle.textContent = matchedCategories.length ? matchedCategories.join(' and ') + ' matched' : 'No match yet';
        setResult(points
          ? 'Matched ' + [newSongPoint ? 'song' : '', newArtistPoint ? 'artist' : ''].filter(Boolean).join(' and ') + '. +' + points + (points === 1 ? ' point. Keep guessing.' : ' points. Keep guessing.')
          : matchedCategories.length
            ? 'Already earned the ' + matchedCategories.join(' and ') + ' point. Keep guessing for another match.'
            : 'No match yet. Keep trying until the timer ends.', points ? 'correct' : '');
        answerInput.value = '';
        answerInput.focus();
      }

      startButton.addEventListener('click', () => {
        round = 0;
        score = 0;
        roundResults.length = 0;
        resultsBody.replaceChildren();
        resultsSummary.hidden = true;
        totalCount = null;
        popularTracks = null;
        usedPopularArtists.clear();
        usedIds.clear();
        scoreLabel.textContent = '0';
        updateRoundList();
        loadRound();
      });

      sourceSelect.addEventListener('change', updateSourceWarning);
      answerForm.addEventListener('submit', submitAnswer);
      audioPlayers.forEach(player => player.addEventListener('ended', () => player.pause()));

      if (!api) {
        startButton.disabled = true;
        stageTitle.textContent = 'Jellyfin API unavailable';
        stageCopy.textContent = 'Open this page from a signed-in Jellyfin session.';
      } else {
        startButton.disabled = true;
        api.getCurrentUser().then(user => {
          settingsLink.hidden = user?.Policy?.IsAdministrator !== true;
        }).catch(() => {});
        Promise.all([loadSettings(), loadPlaylists()]).finally(() => { startButton.disabled = false; });
      }
    })();
  </script>
</div>
