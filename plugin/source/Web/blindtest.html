<div id="JellyBlindTestPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <style>
    #JellyBlindTestPage {
      color-scheme: dark;
      --blind-bg: #10171b;
      --blind-panel: #1b252a;
      --blind-line: #35464b;
      --blind-text: #f4f5f3;
      --blind-muted: #a9b8b8;
      --blind-accent: #55d6be;
      --blind-warm: #ffd166;
      --blind-error: #ff8178;
    }

    #JellyBlindTestPage * { box-sizing: border-box; }

    #JellyBlindTestPage {
      margin: 0;
      min-height: 100%;
      color: var(--blind-text);
      background:
        radial-gradient(ellipse at 80% 0%, rgba(62, 112, 107, .23), transparent 45%),
        linear-gradient(145deg, #10171b 0%, #152126 55%, #25201b 100%);
      font-family: system-ui, sans-serif;
    }

    #JellyBlindTestPage .blind-shell {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    #JellyBlindTestPage .blind-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--blind-line);
    }

    #JellyBlindTestPage h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    #JellyBlindTestPage .blind-kicker {
      margin: 0 0 6px;
      color: var(--blind-accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    #JellyBlindTestPage .blind-score {
      min-width: 100px;
      padding: 10px 14px;
      border: 1px solid var(--blind-line);
      border-radius: 6px;
      color: var(--blind-warm);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #JellyBlindTestPage .blind-heading-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #JellyBlindTestPage .blind-settings-link {
      color: var(--blind-muted);
      font-size: 13px;
      text-decoration: none;
    }

    #JellyBlindTestPage .blind-settings-link:hover,
    #JellyBlindTestPage .blind-settings-link:focus { color: var(--blind-accent); }

    #JellyBlindTestPage .blind-settings-link[hidden] { display: none; }

    #JellyBlindTestPage .blind-board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      gap: 24px;
      margin-top: 28px;
      align-items: start;
    }

    #JellyBlindTestPage .blind-main { min-width: 0; }

    #JellyBlindTestPage .blind-stage {
      position: relative;
      display: grid;
      min-height: 250px;
      place-items: center;
      overflow: hidden;
      padding: 32px;
      border: 1px solid var(--blind-line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(85, 214, 190, .08), transparent 45%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 1px, transparent 1px 14px),
        var(--blind-panel);
      text-align: center;
    }

    #JellyBlindTestPage .blind-stage-artwork {
      position: absolute;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      opacity: .23;
      pointer-events: none;
    }

    #JellyBlindTestPage .blind-stage-artwork[hidden] { display: none; }

    #JellyBlindTestPage .blind-stage-artwork::after {
      position: absolute;
      inset: 0;
      background: rgba(16, 23, 27, .52);
      content: '';
    }

    #JellyBlindTestPage .blind-stage-artwork img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(1px);
      transform: scale(1.025);
    }

    #JellyBlindTestPage .blind-stage-content {
      position: relative;
      z-index: 1;
      width: min(100%, 460px);
    }

    #JellyBlindTestPage .blind-stage-mark {
      display: grid;
      width: 72px;
      aspect-ratio: 1;
      margin: 0 auto 18px;
      place-items: center;
      border: 1px solid rgba(85, 214, 190, .45);
      border-radius: 50%;
      color: var(--blind-accent);
      font-size: 30px;
    }

    #JellyBlindTestPage .blind-stage h2 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    #JellyBlindTestPage .blind-stage p {
      margin: 0;
      color: var(--blind-muted);
      line-height: 1.5;
    }

    #JellyBlindTestPage .blind-countdown {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 18px;
      padding: 7px 12px;
      border: 1px solid rgba(85, 214, 190, .36);
      border-radius: 5px;
      color: var(--blind-accent);
      background: rgba(16, 23, 27, .76);
      font-variant-numeric: tabular-nums;
    }

    #JellyBlindTestPage .blind-countdown[hidden] { display: none; }

    #JellyBlindTestPage .blind-countdown strong {
      min-width: 2ch;
      font-size: 22px;
      text-align: center;
    }

    #JellyBlindTestPage .blind-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    #JellyBlindTestPage .blind-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid var(--blind-line);
      border-radius: 5px;
      color: var(--blind-text);
      background: #243238;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #JellyBlindTestPage .blind-button.primary {
      border-color: var(--blind-accent);
      color: #0d1b1a;
      background: var(--blind-accent);
    }

    #JellyBlindTestPage .blind-button:disabled { cursor: default; opacity: .55; }
    #JellyBlindTestPage .blind-button[hidden] { display: none; }

    #JellyBlindTestPage .blind-answer { margin-top: 25px; }

    #JellyBlindTestPage .blind-answer label {
      display: block;
      margin-bottom: 8px;
      color: var(--blind-muted);
      font-size: 14px;
    }

    #JellyBlindTestPage .blind-answer-row {
      display: flex;
      gap: 9px;
    }

    #JellyBlindTestPage .blind-answer input {
      width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid var(--blind-line);
      border-radius: 5px;
      outline: none;
      color: var(--blind-text);
      background: #121a1e;
      font: inherit;
    }

    #JellyBlindTestPage .blind-answer input:focus { border-color: var(--blind-accent); }
    #JellyBlindTestPage .blind-answer input:disabled { opacity: .7; }

    #JellyBlindTestPage .blind-result {
      min-height: 28px;
      margin-top: 12px;
      color: var(--blind-muted);
      line-height: 1.5;
    }

    #JellyBlindTestPage .blind-result.correct { color: var(--blind-accent); }
    #JellyBlindTestPage .blind-result.incorrect { color: var(--blind-warm); }
    #JellyBlindTestPage .blind-result.error { color: var(--blind-error); }

    #JellyBlindTestPage .blind-rail {
      padding: 18px;
      border-top: 3px solid var(--blind-warm);
      background: rgba(16, 23, 27, .7);
    }

    #JellyBlindTestPage .blind-rail h2 {
      margin: 0 0 16px;
      color: var(--blind-warm);
      font-size: 15px;
      text-transform: uppercase;
    }

    #JellyBlindTestPage .blind-rounds {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #JellyBlindTestPage .blind-rounds li {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(169, 184, 184, .17);
      color: var(--blind-muted);
      font-size: 13px;
    }

    #JellyBlindTestPage .blind-rounds li.current { color: var(--blind-text); }
    #JellyBlindTestPage .blind-rounds li.done { color: var(--blind-accent); }

    #JellyBlindTestPage .blind-footnote {
      margin: 14px 0 0;
      color: var(--blind-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      #JellyBlindTestPage .blind-shell { padding-top: 24px; }
      #JellyBlindTestPage .blind-heading { align-items: start; }
      #JellyBlindTestPage .blind-board { grid-template-columns: 1fr; }
      #JellyBlindTestPage .blind-rail { order: -1; }
      #JellyBlindTestPage .blind-rounds { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      #JellyBlindTestPage .blind-rounds li { display: block; border-bottom: 0; text-align: center; }
      #JellyBlindTestPage .blind-rounds li span { display: block; }
      #JellyBlindTestPage .blind-stage { min-height: 220px; padding: 24px 16px; }
      #JellyBlindTestPage .blind-answer-row { flex-direction: column; }
    }
  </style>
  <div data-role="content">
  <main class="blind-shell">
    <header class="blind-heading">
      <div>
        <p class="blind-kicker">Jellyfin music game</p>
        <h1>Blind Test</h1>
      </div>
      <div class="blind-heading-actions">
        <a class="blind-settings-link" id="settings-link" href="#/configurationpage?name=JellyBlindTestSettings" hidden>Settings</a>
        <div class="blind-score" aria-live="polite">Score <span id="score">0</span>/<span id="round-total">5</span></div>
      </div>
    </header>

    <div class="blind-board">
      <section class="blind-main" aria-label="Blind test game">
        <div class="blind-stage" aria-live="polite">
          <div class="blind-stage-artwork" id="artwork-container" hidden>
            <img id="album-art" alt="Album artwork">
          </div>
          <div class="blind-stage-content">
            <div class="blind-stage-mark" aria-hidden="true">♪</div>
            <h2 id="stage-title">Ready when you are</h2>
            <p id="stage-copy">Five random songs. Listen to the preview, then type the title before time runs out.</p>
            <div class="blind-countdown" id="countdown" aria-live="off" hidden>
              <span id="countdown-label">Music</span>
              <strong id="countdown-value">5</strong>
              <span>sec</span>
            </div>
          </div>
        </div>

        <div class="blind-actions">
          <button class="blind-button primary" id="start-button" type="button">Start test</button>
        </div>

        <form class="blind-answer" id="answer-form" hidden>
          <label for="answer-input">What song is this?</label>
          <div class="blind-answer-row">
            <input id="answer-input" name="answer" type="text" autocomplete="off" placeholder="Type the song title" disabled>
            <button class="blind-button" id="submit-button" type="submit" disabled>Check answer</button>
          </div>
        </form>
        <p class="blind-result" id="result" role="status" aria-live="polite"></p>
        <audio id="audio" preload="none"></audio>
      </section>

      <aside class="blind-rail" aria-label="Game progress">
        <h2 id="round-heading">Your set</h2>
        <ol class="blind-rounds" id="round-list">
        </ol>
        <p class="blind-footnote">Only songs available to your Jellyfin user are included.</p>
      </aside>
    </div>
  </main>
  </div>

  <script>
    (function () {
      'use strict';

      const PLUGIN_ID = 'dcfb6e4c-e418-4bca-9a4a-f960e991ad00';
      const DEFAULT_ROUNDS = 5;
      const DEFAULT_PREVIEW_SECONDS = 5;
      const DEFAULT_ANSWER_SECONDS = 15;
      const DEFAULT_REVEAL_SECONDS = 5;
      const MAX_PICK_ATTEMPTS = 12;
      const STUB_TAG = 'mdiscover-stub';
      const api = window.ApiClient ?? (window.parent !== window ? window.parent.ApiClient : null);
      const audio = document.getElementById('audio');
      const startButton = document.getElementById('start-button');
      const answerForm = document.getElementById('answer-form');
      const answerInput = document.getElementById('answer-input');
      const submitButton = document.getElementById('submit-button');
      const stageTitle = document.getElementById('stage-title');
      const stageCopy = document.getElementById('stage-copy');
      const result = document.getElementById('result');
      const scoreLabel = document.getElementById('score');
      const roundHeading = document.getElementById('round-heading');
      const roundList = document.getElementById('round-list');
      const roundTotal = document.getElementById('round-total');
      const countdown = document.getElementById('countdown');
      const countdownLabel = document.getElementById('countdown-label');
      const countdownValue = document.getElementById('countdown-value');
      const settingsLink = document.getElementById('settings-link');
      const artworkContainer = document.getElementById('artwork-container');
      const albumArt = document.getElementById('album-art');

      if (settingsLink && window.parent !== window) {
        settingsLink.href = window.parent.location.pathname + '#/configurationpage?name=JellyBlindTestSettings';
        settingsLink.target = '_top';
      }

      let totalRounds = DEFAULT_ROUNDS;
      let previewSeconds = DEFAULT_PREVIEW_SECONDS;
      let answerSeconds = DEFAULT_ANSWER_SECONDS;
      let revealSeconds = DEFAULT_REVEAL_SECONDS;
      let currentTrack = null;
      let round = 0;
      let score = 0;
      let submitted = false;
      let requestInProgress = false;
      let countdownInterval = 0;
      let totalCount = null;
      const usedIds = new Set();

      function setResult(message, tone) {
        result.textContent = message;
        result.className = 'blind-result' + (tone ? ' ' + tone : '');
      }

      function normalizeAnswer(value) {
        return String(value ?? '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLocaleLowerCase()
          .replace(/[^\p{L}\p{N}]+/gu, ' ')
          .trim();
      }

      function updateRoundList() {
        [...roundList.children].forEach((item, index) => {
          item.classList.toggle('current', index === round - 1 && !submitted);
          item.classList.toggle('done', index < round - (submitted ? 0 : 1));
          const state = item.children[1];
          if (index < round - 1 || (index === round - 1 && submitted)) {
            state.textContent = 'Done';
          } else if (index === round - 1) {
            state.textContent = 'Playing';
          } else {
            state.textContent = 'Waiting';
          }
        });
        roundHeading.textContent = round > 0 && round <= totalRounds
          ? 'Round ' + round + ' of ' + totalRounds
          : 'Your set';
      }

      function renderRoundSlots() {
        roundList.replaceChildren();
        for (let index = 0; index < totalRounds; index++) {
          const item = document.createElement('li');
          const number = document.createElement('span');
          const state = document.createElement('span');
          number.textContent = String(index + 1).padStart(2, '0');
          state.textContent = 'Waiting';
          item.append(number, state);
          roundList.append(item);
        }
        roundTotal.textContent = String(totalRounds);
      }

      async function loadSettings() {
        try {
          const settings = await api.ajax({
            type: 'GET',
            url: api.getUrl('jellyblindtest/settings'),
            dataType: 'json',
          });
          const configuredRounds = Number(settings?.roundCount ?? settings?.RoundCount);
          const configuredPreview = Number(settings?.previewSeconds ?? settings?.PreviewSeconds);
          const configuredAnswer = Number(settings?.answerSeconds ?? settings?.AnswerSeconds);
          const configuredReveal = Number(settings?.revealSeconds ?? settings?.RevealSeconds);
          if (Number.isFinite(configuredRounds)) totalRounds = Math.max(1, Math.min(20, Math.round(configuredRounds)));
          if (Number.isFinite(configuredPreview)) previewSeconds = Math.max(1, Math.min(30, Math.round(configuredPreview)));
          if (Number.isFinite(configuredAnswer)) answerSeconds = Math.max(1, Math.min(120, Math.round(configuredAnswer)));
          if (Number.isFinite(configuredReveal)) revealSeconds = Math.max(1, Math.min(30, Math.round(configuredReveal)));
        } catch (_) {
          setResult('Using default game settings.', 'error');
        }

        renderRoundSlots();
        stageCopy.textContent = totalRounds + ' random songs. ' + previewSeconds + ' seconds to listen, ' + answerSeconds + ' seconds to answer.';
      }

      function showAlbumArtwork(track) {
        const imageTag = track.AlbumPrimaryImageTag || track.ImageTags?.Primary;
        const imageItemId = track.AlbumId || track.Id;
        if (!imageTag || !imageItemId) {
          artworkContainer.hidden = true;
          albumArt.removeAttribute('src');
          return;
        }

        albumArt.alt = track.Album ? track.Album + ' album artwork' : 'Album artwork';
        albumArt.onerror = () => { artworkContainer.hidden = true; };
        albumArt.src = api.getImageUrl(imageItemId, {
          type: 'Primary',
          tag: imageTag,
          maxWidth: 440,
          quality: 90,
        });
        artworkContainer.hidden = false;
      }

      function clearCountdown() {
        window.clearInterval(countdownInterval);
        countdownInterval = 0;
        countdown.hidden = true;
      }

      function startCountdown(label, seconds, onComplete) {
        window.clearInterval(countdownInterval);
        countdownLabel.textContent = label;
        countdown.hidden = false;
        const deadline = Date.now() + seconds * 1000;

        function tick() {
          const remaining = Math.max(0, deadline - Date.now());
          countdownValue.textContent = String(Math.ceil(remaining / 1000));
          if (remaining === 0) {
            window.clearInterval(countdownInterval);
            countdownInterval = 0;
            onComplete();
          }
        }

        tick();
        if (seconds > 0) countdownInterval = window.setInterval(tick, 100);
      }

      function stopAudio(reset = true) {
        clearCountdown();
        audio.pause();
        if (reset) {
          try { audio.currentTime = 0; } catch (_) { /* Metadata may not be ready. */ }
        }
      }

      function finishGame() {
        stopAudio();
        currentTrack = null;
        stageTitle.textContent = 'Set complete';
        stageCopy.textContent = 'You scored ' + score + ' out of ' + totalRounds + '. Ready for another set?';
        answerForm.hidden = true;
        artworkContainer.hidden = true;
        albumArt.removeAttribute('src');
        countdown.hidden = true;
        startButton.hidden = false;
        startButton.textContent = 'Play again';
        roundHeading.textContent = 'Final score';
        setResult('');
      }

      async function chooseRandomTrack() {
        const userId = api.getCurrentUserId();
        const baseQuery = {
          IncludeItemTypes: 'Audio',
          Recursive: true,
          Limit: 1,
          Fields: 'Tags,ImageTags,AlbumPrimaryImageTag,AlbumId,Album,AlbumArtist,Artists,AlbumArtists',
        };

        if (totalCount === null) {
          const countResponse = await api.getItems(userId, {
            ...baseQuery,
            EnableTotalRecordCount: true,
          });
          totalCount = Number(countResponse?.TotalRecordCount ?? 0);
        }

        if (totalCount < 1) throw new Error('No songs are available in your Jellyfin library.');
        if (usedIds.size >= totalCount) usedIds.clear();

        for (let attempt = 0; attempt < MAX_PICK_ATTEMPTS; attempt++) {
          const startIndex = Math.floor(Math.random() * totalCount);
          const response = await api.getItems(userId, {
            ...baseQuery,
            EnableTotalRecordCount: false,
            StartIndex: startIndex,
          });
          const item = response?.Items?.[0];
          if (!item?.Id || usedIds.has(item.Id)) continue;
          if ((item.Tags ?? []).includes(STUB_TAG)) continue;
          usedIds.add(item.Id);
          return item;
        }

        throw new Error('Could not find another unused song. Try starting a new set.');
      }

      async function loadRound() {
        if (requestInProgress) return;
        requestInProgress = true;
        stopAudio();
        submitted = false;
        currentTrack = null;
        startButton.hidden = true;
        answerForm.hidden = true;
        artworkContainer.hidden = true;
        albumArt.removeAttribute('src');
        setResult('Finding a random song…');
        stageTitle.textContent = 'Picking a song';
        stageCopy.textContent = 'One moment.';

        try {
          currentTrack = await chooseRandomTrack();
          round++;
          answerForm.hidden = true;
          answerInput.disabled = true;
          submitButton.disabled = true;
          answerInput.value = '';
          stageTitle.textContent = 'Listen closely';
          stageCopy.textContent = 'Listen to the preview. The answer box opens when it ends.';
          setResult('');
          updateRoundList();

          const streamUrl = api.getUrl('Audio/' + encodeURIComponent(currentTrack.Id) + '/stream', {
            api_key: api.accessToken(),
            static: true,
          });
          audio.src = streamUrl;
          await audio.play();
          startCountdown('Music', previewSeconds, () => {
            audio.pause();
            beginAnswerPhase();
          });
        } catch (error) {
          stopAudio();
          stageTitle.textContent = 'Could not start this round';
          stageCopy.textContent = error?.message ?? 'The song library could not be read.';
          startButton.hidden = false;
          startButton.textContent = round === 0 ? 'Try again' : 'Start a new set';
          setResult('Check that this user has access to music in Jellyfin.', 'error');
        } finally {
          requestInProgress = false;
        }
      }

      function revealAnswer(timedOut) {
        if (!currentTrack) return;
        submitted = true;
        answerForm.hidden = true;
        answerInput.disabled = true;
        submitButton.disabled = true;

        const artist = currentTrack.AlbumArtist
          ?? currentTrack.Artists?.[0]
          ?? currentTrack.AlbumArtists?.[0]?.Name
          ?? 'Unknown artist';
        if (timedOut) {
          stageTitle.textContent = 'Time is up';
          setResult('No answer submitted. The song was:', 'incorrect');
        }
        stageCopy.textContent = currentTrack.Name + ' — ' + artist;
        showAlbumArtwork(currentTrack);
        updateRoundList();
      }

      async function beginRevealPhase(timedOut) {
        revealAnswer(timedOut);

        countdownLabel.textContent = 'Next song in';
        try {
          await audio.play();
        } catch (_) {
          setResult('The reveal will continue without audio.', 'error');
        }
        startCountdown('Next song in', revealSeconds, () => {
          stopAudio();
          if (round >= totalRounds) finishGame();
          else loadRound();
        });
      }

      function beginAnswerPhase() {
        answerForm.hidden = false;
        answerInput.disabled = false;
        submitButton.disabled = false;
        answerInput.value = '';
        answerInput.focus();
        stageTitle.textContent = 'Your answer';
        stageCopy.textContent = 'Type the title before time runs out.';
        startCountdown('Answer', answerSeconds, () => beginRevealPhase(!submitted));
      }

      function submitAnswer(event) {
        event.preventDefault();
        if (!currentTrack || submitted) return;
        const guess = normalizeAnswer(answerInput.value);
        if (!guess) {
          setResult('Type a title or choose to reveal the answer.', 'error');
          answerInput.focus();
          return;
        }

        submitted = true;
        answerInput.disabled = true;
        submitButton.disabled = true;
        const correct = guess === normalizeAnswer(currentTrack.Name);
        if (correct) score++;
        scoreLabel.textContent = String(score);

        stageTitle.textContent = correct ? 'Correct' : 'Not quite';
        setResult(correct ? 'Nice one. The reveal starts when the answer clock ends.' : 'Answer recorded. The reveal starts when the clock ends.', correct ? 'correct' : 'incorrect');
        answerInput.value = '';
      }

      startButton.addEventListener('click', () => {
        round = 0;
        score = 0;
        totalCount = null;
        usedIds.clear();
        scoreLabel.textContent = '0';
        updateRoundList();
        loadRound();
      });

      answerForm.addEventListener('submit', submitAnswer);
      audio.addEventListener('ended', () => audio.pause());

      if (!api) {
        startButton.disabled = true;
        stageTitle.textContent = 'Jellyfin API unavailable';
        stageCopy.textContent = 'Open this page from a signed-in Jellyfin session.';
      } else {
        startButton.disabled = true;
        api.getCurrentUser().then(user => {
          settingsLink.hidden = user?.Policy?.IsAdministrator !== true;
        }).catch(() => {});
        loadSettings().finally(() => { startButton.disabled = false; });
      }
    })();
  </script>
</div>
